{
"name": "Build Android package",
"on": {
"push": {"branches": ["main"], "tags": ["v*"]},
"pull_request": {},
"workflow_dispatch": {}
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{"uses": "actions/checkout@v4"},
{"name": "Install Android NDK and Ninja", "run": "SDKMANAGER=\"$(find \"$ANDROID_HOME/cmdline-tools\" -name sdkmanager -type f | head -n 1)\" && test -n \"$SDKMANAGER\" && yes | \"$SDKMANAGER\" --sdk_root=\"$ANDROID_HOME\" 'platforms;android-28' 'ndk;28.2.13676358' && sudo apt-get update && sudo apt-get install -y ninja-build"},
{"name": "Build ARM64 package", "run": "bash scripts/build.sh arm64-v8a"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "OreOutline-arm64-v8a", "path": "build-arm64-v8a/ore_outline-0.1.0-arm64-v8a.levipack"}},
{"name": "Attach package to release", "if": "startsWith(github.ref, 'refs/tags/v')", "uses": "softprops/action-gh-release@v2", "with": {"files": "build-arm64-v8a/ore_outline-0.1.0-arm64-v8a.levipack"}}
]
}
}
}